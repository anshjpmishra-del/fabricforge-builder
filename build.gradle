plugins {
    id 'java'
    id 'maven-publish'
    id 'net.fabricmc.loom' version '1.17-SNAPSHOT'
}

version = '1.0.0'
group = 'com.example.my_first_mod'

base {
    archivesName = 'my_first_mod'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.3'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.150.1+26.2'
}

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from('LICENSE') { rename { "${it}_${project.archivesBaseName}" } }
}